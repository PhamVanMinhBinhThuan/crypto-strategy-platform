name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sentiment-contract-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/sentiment/pyproject.toml
      - name: Reject runtime contract drift
        run: diff -r specs/008-news-sentiment/contracts/sentiment-v1 modules/contracts/src/main/resources/contracts/sentiment-v1
      - name: Java contract and News tests
        run: ./gradlew :modules:contracts:test :modules:news:test
      - name: Python contract dependencies
        run: python -m pip install -e 'apps/sentiment[test]'
      - name: Python sentiment-v1 contract tests
        working-directory: apps/sentiment
        run: python -m pytest tests/contract
