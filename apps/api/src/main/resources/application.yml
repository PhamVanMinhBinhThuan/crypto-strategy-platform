spring:
  application:
    name: crypto-strategy-api
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 3000

platform:
  error:
    retry-after-seconds: ${PLATFORM_ERROR_RETRY_AFTER_SECONDS:5}
  idempotency:
    receipt-lifetime: ${PLATFORM_IDEMPOTENCY_RECEIPT_LIFETIME:PT24H}
  market-data:
    provider: ${PLATFORM_MARKET_DATA_PROVIDER:fixture}
    normalization-version: ${PLATFORM_MARKET_DATA_NORMALIZATION_VERSION:binance-v1}
    checksum-contract-version: ${PLATFORM_MARKET_DATA_CHECKSUM_CONTRACT_VERSION:candle-v1}
    binance:
      rest-base-url: ${PLATFORM_MARKET_DATA_BINANCE_REST_BASE_URL:https://api.binance.com}
      websocket-base-url: ${PLATFORM_MARKET_DATA_BINANCE_WEBSOCKET_BASE_URL:wss://stream.binance.com:9443}
      connect-timeout: ${PLATFORM_MARKET_DATA_BINANCE_CONNECT_TIMEOUT:PT5S}
      request-timeout: ${PLATFORM_MARKET_DATA_BINANCE_REQUEST_TIMEOUT:PT10S}
      page-size: ${PLATFORM_MARKET_DATA_BINANCE_PAGE_SIZE:1000}
      max-pages: ${PLATFORM_MARKET_DATA_BINANCE_MAX_PAGES:1000}
      retry:
        max-attempts: ${PLATFORM_MARKET_DATA_BINANCE_RETRY_MAX_ATTEMPTS:3}
        initial-delay: ${PLATFORM_MARKET_DATA_BINANCE_RETRY_INITIAL_DELAY:PT0.25S}
        max-delay: ${PLATFORM_MARKET_DATA_BINANCE_RETRY_MAX_DELAY:PT5S}
      reconnect:
        max-attempts: ${PLATFORM_MARKET_DATA_BINANCE_RECONNECT_MAX_ATTEMPTS:5}
        initial-delay: ${PLATFORM_MARKET_DATA_BINANCE_RECONNECT_INITIAL_DELAY:PT0.5S}
        max-delay: ${PLATFORM_MARKET_DATA_BINANCE_RECONNECT_MAX_DELAY:PT5S}
  security:
    jwt:
      issuer: ${SUPABASE_JWT_ISSUER:}
      jwk-set-uri: ${SUPABASE_JWT_JWKS_URI:}
      audience: ${SUPABASE_JWT_AUDIENCE:}
    websocket-ticket-lifetime: ${PLATFORM_SECURITY_WEBSOCKET_TICKET_LIFETIME:PT60S}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,databaseReadiness
  health:
    db:
      enabled: false

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.apache: INFO
  structured:
    format:
      console: logstash

server:
  port: 8080
