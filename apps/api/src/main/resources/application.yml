spring:
  application:
    name: crypto-strategy-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 3000

platform:
  error:
    retry-after-seconds: ${PLATFORM_ERROR_RETRY_AFTER_SECONDS:5}
  idempotency:
    receipt-lifetime: ${PLATFORM_IDEMPOTENCY_RECEIPT_LIFETIME:PT24H}
  realtime:
    max-candle-subscriptions: ${PLATFORM_REALTIME_MAX_CANDLE_SUBSCRIPTIONS:4}
    max-workload-subscriptions: ${PLATFORM_REALTIME_MAX_WORKLOAD_SUBSCRIPTIONS:4}
    max-message-bytes: ${PLATFORM_REALTIME_MAX_MESSAGE_BYTES:65536}
    max-commands-per-window: ${PLATFORM_REALTIME_MAX_COMMANDS_PER_WINDOW:30}
    command-window: ${PLATFORM_REALTIME_COMMAND_WINDOW:PT10S}
    outbound-buffer-capacity: ${PLATFORM_REALTIME_OUTBOUND_BUFFER_CAPACITY:128}
    heartbeat-timeout: ${PLATFORM_REALTIME_HEARTBEAT_TIMEOUT:PT90S}
    streams:
      enabled: ${PLATFORM_REALTIME_WORK_STREAM_ENABLED:true}
      progress: ${PLATFORM_REALTIME_PROGRESS_STREAM:progress.events.v1}
      lifecycle: ${PLATFORM_REALTIME_LIFECYCLE_STREAM:lifecycle.events.v1}
      candidate-evaluated: ${PLATFORM_REALTIME_CANDIDATE_EVALUATED_STREAM:candidate.evaluated.v1}
      poll-timeout: ${PLATFORM_REALTIME_STREAM_POLL_TIMEOUT:PT1S}
  market-data:
    provider: ${PLATFORM_MARKET_DATA_PROVIDER:fixture}
    normalization-version: ${PLATFORM_MARKET_DATA_NORMALIZATION_VERSION:binance-v1}
    checksum-contract-version: ${PLATFORM_MARKET_DATA_CHECKSUM_CONTRACT_VERSION:candle-v1}
    binance:
      rest-base-url: ${PLATFORM_MARKET_DATA_BINANCE_REST_BASE_URL:https://api.binance.com}
      websocket-base-url: ${PLATFORM_MARKET_DATA_BINANCE_WEBSOCKET_BASE_URL:wss://stream.binance.com:9443}
      connect-timeout: ${PLATFORM_MARKET_DATA_BINANCE_CONNECT_TIMEOUT:PT5S}
      request-timeout: ${PLATFORM_MARKET_DATA_BINANCE_REQUEST_TIMEOUT:PT10S}
      page-size: ${PLATFORM_MARKET_DATA_BINANCE_PAGE_SIZE:1000}
      max-pages: ${PLATFORM_MARKET_DATA_BINANCE_MAX_PAGES:1000}
      retry:
        max-attempts: ${PLATFORM_MARKET_DATA_BINANCE_RETRY_MAX_ATTEMPTS:3}
        initial-delay: ${PLATFORM_MARKET_DATA_BINANCE_RETRY_INITIAL_DELAY:PT0.25S}
        max-delay: ${PLATFORM_MARKET_DATA_BINANCE_RETRY_MAX_DELAY:PT5S}
      reconnect:
        max-attempts: ${PLATFORM_MARKET_DATA_BINANCE_RECONNECT_MAX_ATTEMPTS:5}
        initial-delay: ${PLATFORM_MARKET_DATA_BINANCE_RECONNECT_INITIAL_DELAY:PT0.5S}
        max-delay: ${PLATFORM_MARKET_DATA_BINANCE_RECONNECT_MAX_DELAY:PT5S}
  security:
    allowed-origins: ${PLATFORM_SECURITY_ALLOWED_ORIGINS:}
    jwt:
      issuer: ${SUPABASE_JWT_ISSUER:}
      jwk-set-uri: ${SUPABASE_JWT_JWKS_URI:}
      audience: ${SUPABASE_JWT_AUDIENCE:}
    websocket-ticket-lifetime: ${PLATFORM_SECURITY_WEBSOCKET_TICKET_LIFETIME:PT60S}
    websocket-max-connection-lifetime: ${PLATFORM_SECURITY_WEBSOCKET_MAX_CONNECTION_LIFETIME:PT30M}
    internal-news-audit-token: ${PLATFORM_SECURITY_INTERNAL_NEWS_AUDIT_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,databaseReadiness
  health:
    db:
      enabled: false

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.apache: INFO
  structured:
    format:
      console: logstash

server:
  port: 8080
