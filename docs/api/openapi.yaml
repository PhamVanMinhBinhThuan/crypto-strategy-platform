openapi: 3.1.0

info:
  title: Crypto Strategy Lab API
  version: 0.2.0
  description: |-
    Draft public REST contract for the Crypto Strategy Lab MVP.
    Long-running Backtest and Experiment operations are asynchronous.
    WebSocket messages are versioned separately in `websocket-events.md`.

servers:
  - url: /api/v1
    description: Current host

security:
  - bearerAuth: []

tags:
  - name: Market
  - name: Datasets
  - name: Strategies
  - name: Private Strategies
  - name: Backtesting
  - name: Experiments
  - name: Leaderboard
  - name: News
  - name: Realtime
  - name: Internal News Audit

paths:
  /candles:
    get:
      tags: [Market]
      operationId: listCandles
      summary: Get historical candles
      description: Candles are ordered by `openTime`; `startTime` is inclusive and `endTime` is exclusive.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Pair'
        - $ref: '#/components/parameters/Timeframe'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Historical candles returned successfully.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandlePage' }
              example:
                items:
                  - pair: BTC/USDT
                    timeframe: 5m
                    openTime: '2026-08-16T01:00:00Z'
                    closeTime: '2026-08-16T01:05:00Z'
                    open: '59120.10'
                    high: '59280.50'
                    low: '59080.00'
                    close: '59210.25'
                    volume: '18.425'
                    closed: true
                nextCursor: null
                hasMore: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /datasets:
    post:
      tags: [Datasets]
      operationId: createDataset
      summary: Create an immutable Dataset snapshot
      description: Freezes the canonical Candle membership selected by an inclusive start and exclusive end.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDatasetRequest' }
            example:
              pair: BTC/USDT
              timeframe: 5m
              startTime: '2026-09-02T00:00:00Z'
              endTime: '2026-09-02T00:20:00Z'
      responses:
        '201':
          description: Dataset snapshot created.
          headers:
            Location:
              description: URL of the immutable Dataset snapshot.
              schema: { type: string, format: uri-reference }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetSnapshot' }
              example:
                datasetId: 01J00000000000000000000001
                version: candle-v1
                provider: BINANCE
                pair: BTC/USDT
                timeframe: 5m
                normalizationVersion: binance-v1
                startTime: '2026-09-02T00:00:00Z'
                endTime: '2026-09-02T00:20:00Z'
                membershipCount: 4
                checksum: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                status: READY
                createdAt: '2026-09-02T00:21:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /datasets/{datasetId}:
    get:
      tags: [Datasets]
      operationId: getDataset
      summary: Get an immutable Dataset snapshot
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: Dataset snapshot returned successfully.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /strategies:
    get:
      tags: [Strategies]
      operationId: listStrategies
      summary: List registered strategies
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Registered strategy descriptors.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyPage' }
              example:
                items:
                  - strategyId: ma-crossover
                    strategyVersionId: 01J00000000000000000000020
                    version: 1.0.0
                    contractVersion: strategy-contract-v1
                    displayName: Moving Average Crossover
                    description: Compares fast and slow moving averages
                    category: TREND
                    supportedSignals: [BUY, SELL, HOLD]
                    requiredLookback: 25
                    parameters:
                      - name: fastPeriod
                        type: INTEGER
                        required: true
                        minimum: '2'
                        maximum: '100'
                        defaultValue: '5'
                        allowedValues: []
                        description: Fast moving-average period
                    constraints:
                      - lowerParameter: fastPeriod
                        upperParameter: slowPeriod
                    descriptorFingerprint: strategy-descriptor-v1:ma-crossover:1.0.0
                nextCursor: null
                hasMore: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /user-strategies:
    get:
      tags: [Private Strategies]
      operationId: listUserStrategies
      summary: List Strategies owned by the authenticated user
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Owner-scoped Strategy library.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserStrategyPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Private Strategies]
      operationId: createUserStrategy
      summary: Create a private Strategy with its first immutable version
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserStrategyRequest' }
            example:
              name: Private MA
              description: Exact private parameters
              kind: SINGLE
              source:
                type: SINGLE
                strategy:
                  strategyId: ma-crossover
                  version: 1.0.0
                  parameters:
                    fastPeriod: 5
                    slowPeriod: 25
                    threshold: '0.100000000001'
      responses:
        '201':
          description: Private Strategy created.
          headers:
            Location:
              description: URL of the private Strategy.
              schema: { type: string, format: uri-reference }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserStrategy' }
              example:
                userStrategyId: 01J00000000000000000000002
                kind: SINGLE
                name: Private MA
                description: Exact private parameters
                status: ACTIVE
                archivedAt: null
                createdAt: '2026-09-02T01:00:00Z'
                updatedAt: '2026-09-02T01:00:00Z'
                latestVersion:
                  userStrategyVersionId: 01J00000000000000000000021
                  userStrategyId: 01J00000000000000000000002
                  versionNo: 1
                  kind: SINGLE
                  source:
                    type: SINGLE
                    strategy:
                      strategyId: ma-crossover
                      strategyVersionId: 01J00000000000000000000020
                      version: 1.0.0
                      parameters:
                        fastPeriod: '5'
                        slowPeriod: '25'
                        threshold: '0.100000000001'
                  status: DRAFT
                  fingerprint: strategy-v1:private-ma:1
                  publishedAt: null
                  createdAt: '2026-09-02T01:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }

  /user-strategies/{userStrategyId}:
    get:
      tags: [Private Strategies]
      operationId: getUserStrategy
      summary: Get one private Strategy and its latest version
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserStrategyId'
      responses:
        '200':
          description: Private Strategy returned successfully.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserStrategy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /user-strategies/{userStrategyId}/versions:
    post:
      tags: [Private Strategies]
      operationId: createUserStrategyVersion
      summary: Create the next immutable private Strategy version
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserStrategyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserStrategyVersionRequest' }
      responses:
        '201':
          description: New draft version created.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserStrategyVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }

  /user-strategies/{userStrategyId}/versions/{versionId}/publish:
    post:
      tags: [Private Strategies]
      operationId: publishUserStrategyVersion
      summary: Publish an immutable private Strategy version
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserStrategyId'
        - $ref: '#/components/parameters/UserStrategyVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishUserStrategyVersionRequest' }
      responses:
        '200':
          description: Version published.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserStrategyVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }

  /user-strategies/{userStrategyId}/archive:
    post:
      tags: [Private Strategies]
      operationId: archiveUserStrategy
      summary: Archive a private Strategy without modifying published versions
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserStrategyId'
      responses:
        '200':
          description: Strategy archived or returned from an equivalent replay.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserStrategy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /backtests:
    post:
      tags: [Backtesting]
      operationId: startBacktest
      summary: Start a Backtest
      description: Creates an immutable request and queues execution. Retries must reuse the same idempotency key.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartBacktestRequest' }
            example:
              datasetId: 01JDATASET00000000000000001
              strategy:
                strategyId: ma-crossover
                version: 1.0.0
                parameters: { fastPeriod: 20, slowPeriod: 50 }
              configuration:
                initialCapital: '10000.00'
                feeRate: '0.001'
                positionMode: LONG_ONLY
                executionPriceRule: NEXT_CANDLE_OPEN
      responses:
        '202':
          description: Backtest accepted for asynchronous execution.
          headers:
            Location:
              description: URL of the Job used to track Backtest execution.
              schema: { type: string, format: uri-reference }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BacktestAccepted' }
              example:
                backtestId: 01JBACKTEST0000000000000001
                jobId: 01JJOB00000000000000000001
                status: QUEUED
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /backtest-results/{resultId}:
    get:
      tags: [Backtesting]
      operationId: getBacktestResult
      summary: Get an immutable Backtest result
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ResultId'
      responses:
        '200':
          description: Backtest result returned successfully.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BacktestResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /jobs/{jobId}:
    get:
      tags: [Backtesting, Experiments]
      operationId: getJob
      summary: Get asynchronous Job status
      description: A failed Job is returned with `200 OK` and `status` set to `FAILED`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Current Job state.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
              example:
                jobId: 01JJOB00000000000000000002
                experimentId: 01JEXPERIMENT0000000000001
                candidateId: 01JCANDIDATE00000000000001
                type: BACKTEST
                status: FAILED
                totalWork: 1
                completedWork: 0
                failedWork: 1
                bestScore: null
                queuedAt: '2026-08-16T02:00:00Z'
                startedAt: '2026-08-16T02:00:01Z'
                finishedAt: '2026-08-16T02:15:00Z'
                nextRetryAt: null
                failure:
                  code: JOB_EXECUTION_TIMEOUT
                  message: The job exceeded its execution timeout.
                createdAt: '2026-08-16T02:00:00Z'
                updatedAt: '2026-08-16T02:15:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /jobs/{jobId}/cancel:
    post:
      tags: [Backtesting, Experiments]
      operationId: cancelJob
      summary: Request cancellation of an owned Job
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Cancellation accepted or an equivalent request already exists.
          headers:
            Location:
              description: URL of the authoritative Job state.
              schema: { type: string, format: uri-reference }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /experiments:
    post:
      tags: [Experiments]
      operationId: startExperiment
      summary: Start a strategy search Experiment
      description: |-
        Reserved contract for freezing a search configuration and queuing execution.
        This operation currently returns `503 DEPENDENCY_UNAVAILABLE` until the Search
        Coordinator publishes its application boundary; no partial Experiment is created.
      x-readiness: BLOCKED_SEARCH_COORDINATOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartExperimentRequest' }
            example:
              name: BTC MA random search
              datasetId: 01JDATASET00000000000000001
              generator: { generatorId: random, version: 1.0.0, seed: 20260816 }
              searchSpace:
                strategyId: ma-crossover
                strategyVersion: 1.0.0
                parameters:
                  fastPeriod: { minimum: 5, maximum: 30 }
                  slowPeriod: { minimum: 40, maximum: 120 }
              stopCondition: { maximumCandidates: 100, maximumDurationSeconds: 300 }
              topK: 10
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /experiments/{experimentId}:
    get:
      tags: [Experiments]
      operationId: getExperiment
      summary: Get an authoritative Experiment snapshot
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ExperimentId'
      responses:
        '200':
          description: Current durable Experiment state.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Experiment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /experiments/{experimentId}/stop:
    post:
      tags: [Experiments]
      operationId: stopExperiment
      summary: Request an owned Experiment to stop
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ExperimentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Stop request accepted or returned from an equivalent replay.
          headers:
            Location:
              description: URL of the authoritative Experiment state.
              schema: { type: string, format: uri-reference }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Experiment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /experiments/{experimentId}/reproductions:
    post:
      tags: [Experiments]
      operationId: reproduceExperiment
      summary: Create a new Experiment linked to immutable original evidence
      description: |-
        Reserved contract. This operation currently returns `503 DEPENDENCY_UNAVAILABLE`
        until the Search Coordinator is available; the original Experiment is not modified.
      x-readiness: BLOCKED_SEARCH_COORDINATOR
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ExperimentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /experiments/{experimentId}/candidates:
    get:
      tags: [Experiments]
      operationId: listExperimentCandidates
      summary: List deterministic Candidate definitions for an owned Experiment
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ExperimentId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Candidate page returned successfully.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidatePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /experiments/{experimentId}/candidates/{candidateId}:
    get:
      tags: [Experiments]
      operationId: getExperimentCandidate
      summary: Get one Candidate through its owned Experiment parent
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ExperimentId'
        - $ref: '#/components/parameters/CandidateId'
      responses:
        '200':
          description: Candidate returned successfully.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /experiments/{experimentId}/leaderboard:
    get:
      tags: [Leaderboard]
      operationId: getExperimentLeaderboard
      summary: Get the current Top-K Leaderboard
      description: Ordering follows the Experiment's versioned ranking policy.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ExperimentId'
        - $ref: '#/components/parameters/LeaderboardLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Latest Leaderboard revision.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Leaderboard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /news-items:
    get:
      tags: [News]
      operationId: listNewsItems
      summary: List normalized news items
      description: Returns newest items first with deterministic ID tie-breaking.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TradingPairId'
        - name: analysisStatus
          in: query
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/NewsAnalysisStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: News items returned successfully.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsItemPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /realtime/ticket:
    post:
      tags: [Realtime]
      operationId: issueWebSocketTicket
      summary: Issue a short-lived, one-time WebSocket handshake ticket
      description: The ticket is bound to the authenticated user and exact allowed Origin; the access token is never placed in the WebSocket URL.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: One-time ticket issued.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebSocketTicket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /internal/news-items/{newsId}/sentiment:
    get:
      tags: [Internal News Audit]
      operationId: getNewsSentimentAudit
      summary: Get protected sentiment provenance for one News Item
      description: Internal network/service-token endpoint; it is not a browser API.
      security:
        - internalServiceToken: []
      parameters:
        - name: newsId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OpaqueId' }
      responses:
        '200':
          description: Latest immutable sentiment result and release provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SentimentAudit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  headers:
    CorrelationId:
      description: Correlation identifier generated or accepted by the API.
      schema: { $ref: '#/components/schemas/OpaqueId' }
    RetryAfter:
      description: Seconds the client should wait before retrying.
      schema: { type: integer, minimum: 1 }

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Optional client correlation ID; an invalid value may be replaced.
      schema: { $ref: '#/components/schemas/OpaqueId' }
    Origin:
      name: Origin
      in: header
      required: true
      description: Exact browser Origin; it must match the configured allowlist.
      schema: { type: string, format: uri }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Reusing this key with a different canonical payload returns `409 Conflict`.
      schema: { type: string, minLength: 1, maxLength: 255 }
    Pair:
      name: pair
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Pair' }
    OptionalPair:
      name: pair
      in: query
      required: false
      schema: { $ref: '#/components/schemas/Pair' }
    TradingPairId:
      name: tradingPairId
      in: query
      required: false
      description: Match News linked to either the Trading Pair base or quote Asset.
      schema: { $ref: '#/components/schemas/OpaqueId' }
    Timeframe:
      name: timeframe
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Timeframe' }
    StartTime:
      name: startTime
      in: query
      required: true
      description: Inclusive UTC start.
      schema: { type: string, format: date-time }
    EndTime:
      name: endTime
      in: query
      required: true
      description: Exclusive UTC end; must be later than `startTime`.
      schema: { type: string, format: date-time }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    LeaderboardLimit:
      name: limit
      in: query
      required: false
      description: Bounded by the Experiment's configured Top-K.
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page.
      schema: { type: string, minLength: 1 }
    ResultId:
      name: resultId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    UserStrategyId:
      name: userStrategyId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    UserStrategyVersionId:
      name: versionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    ExperimentId:
      name: experimentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }

  responses:
    BadRequest:
      description: Request syntax, schema, query parameter, or cursor is invalid.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication is missing or invalid; token validation details are concealed.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: The request is denied by an Origin or security policy.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: A requested or referenced resource was not found.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Resource state, version, immutability, or idempotency conflict.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: Request Content-Type is unsupported.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnprocessableContent:
      description: Structurally valid request violates a domain rule.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Client rate limit or quota exceeded.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadGateway:
      description: An upstream response could not be mapped to the canonical contract.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: A provider, database, queue, or internal service is temporarily unavailable.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GatewayTimeout:
      description: An upstream dependency exceeded its timeout.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 128
      description: Opaque public identifier; clients must not parse it.
    Pair:
      type: string
      pattern: '^[A-Z0-9]+/[A-Z0-9]+$'
      examples: [BTC/USDT]
    Timeframe:
      type: string
      enum: [1m, 5m, 15m, 30m, 1h, 2h, 4h, 1d]
    DecimalString:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
    NonNegativeDecimalString:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
    ConfidenceString:
      type: string
      pattern: '^(0(\.[0-9]+)?|1(\.0+)?)$'
      description: Model confidence serialized as a decimal string in the range 0 to 1.
    PolarityScoreString:
      type: string
      pattern: '^-?(0(\.[0-9]+)?|1(\.0+)?)$'
      description: Sentiment polarity serialized as a decimal string in the range -1 to 1.

    PaginationFields:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor: { type: [string, 'null'], minLength: 1 }
        hasMore: { type: boolean }

    Candle:
      type: object
      additionalProperties: false
      required: [pair, timeframe, openTime, closeTime, open, high, low, close, volume, closed]
      properties:
        pair: { $ref: '#/components/schemas/Pair' }
        timeframe: { $ref: '#/components/schemas/Timeframe' }
        openTime: { type: string, format: date-time }
        closeTime: { type: string, format: date-time }
        open: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        high: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        low: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        close: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        volume: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        closed: { type: boolean }
    CandlePage:
      allOf:
        - $ref: '#/components/schemas/PaginationFields'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Candle' }

    CreateDatasetRequest:
      type: object
      additionalProperties: false
      required: [pair, timeframe, startTime, endTime]
      properties:
        pair: { $ref: '#/components/schemas/Pair' }
        timeframe: { $ref: '#/components/schemas/Timeframe' }
        startTime:
          type: string
          format: date-time
          description: Inclusive UTC start.
        endTime:
          type: string
          format: date-time
          description: Exclusive UTC end.
    DatasetSnapshot:
      type: object
      additionalProperties: false
      required: [datasetId, version, provider, pair, timeframe, normalizationVersion, startTime, endTime, membershipCount, checksum, status, createdAt]
      properties:
        datasetId: { $ref: '#/components/schemas/OpaqueId' }
        version: { type: string, minLength: 1 }
        provider: { type: string, minLength: 1 }
        pair: { $ref: '#/components/schemas/Pair' }
        timeframe: { $ref: '#/components/schemas/Timeframe' }
        normalizationVersion: { type: string, minLength: 1 }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        membershipCount: { type: integer, minimum: 1 }
        checksum: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        status: { type: string, const: READY }
        createdAt: { type: string, format: date-time }

    Signal:
      type: string
      enum: [BUY, SELL, HOLD]
    StrategyParameterType:
      type: string
      enum: [INTEGER, DECIMAL, BOOLEAN, TEXT, ENUM]
    StrategyParameterDescriptor:
      type: object
      additionalProperties: false
      required: [name, type, required, defaultValue, minimum, maximum, allowedValues, description]
      properties:
        name: { type: string, minLength: 1 }
        type: { $ref: '#/components/schemas/StrategyParameterType' }
        required: { type: boolean }
        minimum:
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        maximum:
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        defaultValue: { type: [string, 'null'] }
        allowedValues:
          type: array
          items: { type: string }
        description: { type: string }
    CrossParameterRule:
      type: object
      additionalProperties: false
      required: [lowerParameter, upperParameter]
      properties:
        lowerParameter: { type: string, minLength: 1 }
        upperParameter: { type: string, minLength: 1 }
    StrategyDescriptor:
      type: object
      additionalProperties: false
      required: [strategyId, strategyVersionId, version, contractVersion, displayName, description, category, supportedSignals, requiredLookback, parameters, constraints, descriptorFingerprint]
      properties:
        strategyId: { type: string, minLength: 1 }
        strategyVersionId: { $ref: '#/components/schemas/OpaqueId' }
        version: { type: string, minLength: 1 }
        contractVersion: { type: string, minLength: 1 }
        displayName: { type: string, minLength: 1 }
        description: { type: string }
        category: { type: string, minLength: 1 }
        supportedSignals:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Signal' }
        requiredLookback: { type: integer, minimum: 1 }
        parameters:
          type: array
          items: { $ref: '#/components/schemas/StrategyParameterDescriptor' }
        constraints:
          type: array
          items: { $ref: '#/components/schemas/CrossParameterRule' }
        descriptorFingerprint: { type: string, minLength: 1 }
    StrategyPage:
      allOf:
        - $ref: '#/components/schemas/PaginationFields'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/StrategyDescriptor' }

    SingleStrategySourceRequest:
      type: object
      additionalProperties: false
      required: [type, strategy]
      properties:
        type: { type: string, const: SINGLE }
        strategy: { $ref: '#/components/schemas/StrategySelection' }
    CompositeStrategySourceRequest:
      type: object
      additionalProperties: false
      required: [type, policyId, policyVersion, policyParameters, components]
      properties:
        type: { type: string, const: COMPOSITE }
        policyId: { type: string, minLength: 1 }
        policyVersion: { type: string, minLength: 1 }
        policyParameters: { type: object }
        components:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/StrategySelection' }
    StrategyDraftSourceRequest:
      oneOf:
        - $ref: '#/components/schemas/SingleStrategySourceRequest'
        - $ref: '#/components/schemas/CompositeStrategySourceRequest'
      discriminator:
        propertyName: type
    CanonicalStrategyParameters:
      type: object
      additionalProperties:
        type: string
      description: Canonical parameter values; decimals remain exact strings.
    StrategySelectionResponse:
      type: object
      additionalProperties: false
      required: [strategyId, strategyVersionId, version, parameters]
      properties:
        strategyId: { type: string, minLength: 1 }
        strategyVersionId: { $ref: '#/components/schemas/OpaqueId' }
        version: { type: string, minLength: 1 }
        parameters: { $ref: '#/components/schemas/CanonicalStrategyParameters' }
    SingleStrategySourceResponse:
      type: object
      additionalProperties: false
      required: [type, strategy]
      properties:
        type: { type: string, const: SINGLE }
        strategy: { $ref: '#/components/schemas/StrategySelectionResponse' }
    CompositeStrategySourceResponse:
      type: object
      additionalProperties: false
      required: [type, policyId, policyVersion, policyParameters, components]
      properties:
        type: { type: string, const: COMPOSITE }
        policyId: { type: string, minLength: 1 }
        policyVersion: { type: string, minLength: 1 }
        policyParameters: { $ref: '#/components/schemas/CanonicalStrategyParameters' }
        components:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/StrategySelectionResponse' }
    StrategyDraftSourceResponse:
      oneOf:
        - $ref: '#/components/schemas/SingleStrategySourceResponse'
        - $ref: '#/components/schemas/CompositeStrategySourceResponse'
      discriminator:
        propertyName: type
    CreateUserStrategyRequest:
      type: object
      additionalProperties: false
      required: [name, description, kind, source]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        kind: { type: string, enum: [SINGLE, COMPOSITE] }
        source: { $ref: '#/components/schemas/StrategyDraftSourceRequest' }
    CreateUserStrategyVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedLatestVersionNo, source]
      properties:
        expectedLatestVersionNo: { type: integer, minimum: 1 }
        source: { $ref: '#/components/schemas/StrategyDraftSourceRequest' }
    PublishUserStrategyVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersionNo]
      properties:
        expectedVersionNo: { type: integer, minimum: 1 }
    UserStrategyVersion:
      type: object
      additionalProperties: false
      required: [userStrategyVersionId, userStrategyId, versionNo, kind, source, status, fingerprint, publishedAt, createdAt]
      properties:
        userStrategyVersionId: { $ref: '#/components/schemas/OpaqueId' }
        userStrategyId: { $ref: '#/components/schemas/OpaqueId' }
        versionNo: { type: integer, minimum: 1 }
        kind: { type: string, enum: [SINGLE, COMPOSITE] }
        source: { $ref: '#/components/schemas/StrategyDraftSourceResponse' }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        fingerprint: { type: string, minLength: 1 }
        publishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    UserStrategy:
      type: object
      additionalProperties: false
      required: [userStrategyId, kind, name, description, status, archivedAt, createdAt, updatedAt, latestVersion]
      properties:
        userStrategyId: { $ref: '#/components/schemas/OpaqueId' }
        kind: { type: string, enum: [SINGLE, COMPOSITE] }
        name: { type: string, minLength: 1 }
        description: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        latestVersion: { $ref: '#/components/schemas/UserStrategyVersion' }
    UserStrategySummary:
      type: object
      additionalProperties: false
      required: [userStrategyId, kind, name, description, createdAt]
      properties:
        userStrategyId: { $ref: '#/components/schemas/OpaqueId' }
        kind: { type: string, enum: [SINGLE, COMPOSITE] }
        name: { type: string, minLength: 1 }
        description: { type: string }
        createdAt: { type: string, format: date-time }
    UserStrategyPage:
      allOf:
        - $ref: '#/components/schemas/PaginationFields'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/UserStrategySummary' }

    StrategySelection:
      type: object
      additionalProperties: false
      required: [strategyId, version, parameters]
      properties:
        strategyId: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        parameters:
          type: object
          description: Values validated against the selected strategy's versioned schema.
    BacktestConfiguration:
      type: object
      additionalProperties: false
      required: [initialCapital, feeRate, positionMode, executionPriceRule]
      properties:
        initialCapital:
          allOf: [{ $ref: '#/components/schemas/NonNegativeDecimalString' }]
          description: Must be greater than zero.
        feeRate: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        slippageRate:
          allOf: [{ $ref: '#/components/schemas/NonNegativeDecimalString' }]
          default: '0'
        positionMode: { type: string, enum: [LONG_ONLY] }
        executionPriceRule: { type: string, enum: [NEXT_CANDLE_OPEN] }
        forceCloseAtEnd: { type: boolean, default: true }
        roundingMode: { type: string, enum: [HALF_EVEN], default: HALF_EVEN }
    StartBacktestRequest:
      type: object
      additionalProperties: false
      required: [datasetId, strategy, configuration]
      properties:
        datasetId: { $ref: '#/components/schemas/OpaqueId' }
        strategy: { $ref: '#/components/schemas/StrategySelection' }
        configuration: { $ref: '#/components/schemas/BacktestConfiguration' }
    BacktestAccepted:
      type: object
      additionalProperties: false
      required: [backtestId, jobId, status]
      properties:
        backtestId: { $ref: '#/components/schemas/OpaqueId' }
        jobId: { $ref: '#/components/schemas/OpaqueId' }
        status: { type: string, const: QUEUED }
    JobStatus:
      type: string
      description: Durable Search/Backtest Job lifecycle; `COMPLETED` is reserved for Experiment and Backtest Result representations.
      enum: [QUEUED, RUNNING, RETRY_SCHEDULED, SUCCEEDED, FAILED, CANCEL_REQUESTED, CANCELLED]
    JobFailure:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - JOB_EXECUTION_TIMEOUT
            - JOB_RETRY_EXHAUSTED
            - JOB_CANCELLED
            - JOB_MESSAGE_INVALID
            - JOB_DEPENDENCY_UNAVAILABLE
            - JOB_DATASET_NOT_READY
            - JOB_DATASET_INTEGRITY_FAILED
            - JOB_STRATEGY_VERSION_UNAVAILABLE
            - JOB_STRATEGY_PARAMETERS_INVALID
            - JOB_BACKTEST_FAILED
            - JOB_EVALUATION_FAILED
            - JOB_SENTIMENT_ANALYSIS_FAILED
            - JOB_INTERNAL_ERROR
        message: { type: string, minLength: 1 }
    Job:
      type: object
      additionalProperties: false
      required: [jobId, experimentId, candidateId, type, status, totalWork, completedWork, failedWork, bestScore, queuedAt, startedAt, finishedAt, nextRetryAt, failure, createdAt, updatedAt]
      properties:
        jobId: { $ref: '#/components/schemas/OpaqueId' }
        experimentId: { $ref: '#/components/schemas/OpaqueId' }
        candidateId: { type: [string, 'null'], minLength: 1 }
        type: { type: string, enum: [SEARCH, BACKTEST] }
        status: { $ref: '#/components/schemas/JobStatus' }
        totalWork: { type: integer, minimum: 1 }
        completedWork: { type: integer, minimum: 0 }
        failedWork: { type: integer, minimum: 0 }
        bestScore:
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        queuedAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        nextRetryAt: { type: [string, 'null'], format: date-time }
        failure:
          oneOf:
            - $ref: '#/components/schemas/JobFailure'
            - type: 'null'
          description: Present only when `status` is `FAILED`.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BacktestMetrics:
      type: object
      additionalProperties: false
      required: [totalReturn, winRate, maximumDrawdown, numberOfTrades]
      properties:
        totalReturn: { $ref: '#/components/schemas/DecimalString' }
        winRate: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        maximumDrawdown: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        numberOfTrades: { type: integer, minimum: 0 }
    Trade:
      type: object
      additionalProperties: false
      required: [tradeId, sequence, side, entryTime, entryPrice, exitTime, exitPrice, quantity, entryFee, exitFee, totalFee, profitLoss, postTradeCash, exitReason]
      properties:
        tradeId: { $ref: '#/components/schemas/OpaqueId' }
        sequence: { type: integer, minimum: 0 }
        side: { type: string, enum: [LONG] }
        entryTime: { type: string, format: date-time }
        entryPrice: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        exitTime: { type: string, format: date-time }
        exitPrice: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        quantity: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        entryFee: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        exitFee: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        totalFee: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        profitLoss: { $ref: '#/components/schemas/DecimalString' }
        postTradeCash: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        exitReason: { type: string, enum: [STRATEGY_SELL, FORCED_FINAL_CLOSE] }
    BacktestProvenance:
      type: object
      additionalProperties: false
      required: [experimentId, candidateId, jobId, successfulAttemptId, manifestFingerprint, datasetFingerprint, strategyFingerprint, resultFingerprint]
      properties:
        experimentId: { $ref: '#/components/schemas/OpaqueId' }
        candidateId: { $ref: '#/components/schemas/OpaqueId' }
        jobId: { $ref: '#/components/schemas/OpaqueId' }
        successfulAttemptId: { $ref: '#/components/schemas/OpaqueId' }
        manifestFingerprint: { type: string, minLength: 1 }
        datasetFingerprint: { type: string, minLength: 1 }
        strategyFingerprint: { type: string, minLength: 1 }
        resultFingerprint: { type: string, minLength: 1 }
    BacktestAssumptions:
      type: object
      additionalProperties: false
      required: [assumptionsVersion, initialCapital, feeRate, slippageRate, positionMode, executionPriceRule, forceCloseAtEnd, roundingMode]
      properties:
        assumptionsVersion: { type: string, minLength: 1 }
        initialCapital: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        feeRate: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        slippageRate: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        positionMode: { type: string, enum: [LONG_ONLY] }
        executionPriceRule: { type: string, enum: [NEXT_CANDLE_OPEN] }
        forceCloseAtEnd: { type: boolean }
        roundingMode: { type: string, enum: [HALF_EVEN] }
    BacktestResult:
      type: object
      additionalProperties: false
      required: [backtestResultId, backtestId, status, metrics, trades, provenance, assumptions, initialCapital, finalCapital, totalFees, completedAt]
      properties:
        backtestResultId: { $ref: '#/components/schemas/OpaqueId' }
        backtestId: { $ref: '#/components/schemas/OpaqueId' }
        status: { type: string, const: COMPLETED }
        metrics: { $ref: '#/components/schemas/BacktestMetrics' }
        trades:
          type: array
          items: { $ref: '#/components/schemas/Trade' }
        provenance: { $ref: '#/components/schemas/BacktestProvenance' }
        assumptions: { $ref: '#/components/schemas/BacktestAssumptions' }
        initialCapital: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        finalCapital: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        totalFees: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        completedAt: { type: string, format: date-time }

    GeneratorSelection:
      type: object
      additionalProperties: false
      required: [generatorId, version, seed]
      properties:
        generatorId: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        seed: { type: integer, format: int64 }
    NumericRange:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        minimum: { type: number }
        maximum: { type: number }
        step: { type: number, exclusiveMinimum: 0 }
    SearchSpace:
      type: object
      additionalProperties: false
      required: [strategyId, strategyVersion, parameters]
      properties:
        strategyId: { type: string, minLength: 1 }
        strategyVersion: { type: string, minLength: 1 }
        parameters:
          type: object
          minProperties: 1
          additionalProperties: { $ref: '#/components/schemas/NumericRange' }
    StopCondition:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        maximumCandidates: { type: integer, minimum: 1 }
        maximumDurationSeconds: { type: integer, minimum: 1 }
    StartExperimentRequest:
      type: object
      additionalProperties: false
      required: [name, datasetId, generator, searchSpace, stopCondition, topK]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        datasetId: { $ref: '#/components/schemas/OpaqueId' }
        generator: { $ref: '#/components/schemas/GeneratorSelection' }
        searchSpace: { $ref: '#/components/schemas/SearchSpace' }
        stopCondition: { $ref: '#/components/schemas/StopCondition' }
        topK: { type: integer, minimum: 1, maximum: 100 }
    ExperimentAccepted:
      type: object
      additionalProperties: false
      required: [experimentId, jobId, status]
      properties:
        experimentId: { $ref: '#/components/schemas/OpaqueId' }
        jobId: { $ref: '#/components/schemas/OpaqueId' }
        status: { type: string, const: QUEUED }

    ExperimentStatus:
      type: string
      enum: [CREATED, QUEUED, RUNNING, STOP_REQUESTED, STOPPED, COMPLETED, FAILED]
    ExperimentFailure:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        message: { type: string, minLength: 1 }
    Experiment:
      type: object
      additionalProperties: false
      required: [experimentId, name, status, datasetId, jobIds, derivedFromExperimentId, reproducesExperimentId, startedAt, completedAt, failure, createdAt]
      properties:
        experimentId: { $ref: '#/components/schemas/OpaqueId' }
        name: { type: string, minLength: 1 }
        status: { $ref: '#/components/schemas/ExperimentStatus' }
        datasetId: { $ref: '#/components/schemas/OpaqueId' }
        jobIds:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/OpaqueId' }
        derivedFromExperimentId: { type: [string, 'null'], minLength: 1 }
        reproducesExperimentId: { type: [string, 'null'], minLength: 1 }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        failure:
          oneOf:
            - $ref: '#/components/schemas/ExperimentFailure'
            - type: 'null'
        createdAt: { type: string, format: date-time }
    Candidate:
      type: object
      additionalProperties: false
      required: [candidateId, experimentId, generationIndex, definition, generatorState, fingerprint, createdAt]
      properties:
        candidateId: { $ref: '#/components/schemas/OpaqueId' }
        experimentId: { $ref: '#/components/schemas/OpaqueId' }
        generationIndex: { type: integer, minimum: 0 }
        definition: { type: object }
        generatorState: { type: [object, 'null'] }
        fingerprint: { type: string, minLength: 1 }
        createdAt: { type: string, format: date-time }
    CandidatePage:
      allOf:
        - $ref: '#/components/schemas/PaginationFields'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Candidate' }

    LeaderboardEntry:
      type: object
      additionalProperties: false
      required: [rank, evaluationResultId, backtestResultId, score, maximumDrawdown, evaluationFingerprint]
      properties:
        rank: { type: integer, minimum: 1 }
        evaluationResultId: { $ref: '#/components/schemas/OpaqueId' }
        backtestResultId: { $ref: '#/components/schemas/OpaqueId' }
        score: { $ref: '#/components/schemas/DecimalString' }
        maximumDrawdown: { $ref: '#/components/schemas/NonNegativeDecimalString' }
        evaluationFingerprint: { type: string, minLength: 1 }
    Leaderboard:
      allOf:
        - $ref: '#/components/schemas/PaginationFields'
        - type: object
          required: [experimentId, revisionId, revision, topK, rankingPolicyVersion, fingerprint, createdAt, items]
          properties:
            experimentId: { $ref: '#/components/schemas/OpaqueId' }
            revisionId: { $ref: '#/components/schemas/OpaqueId' }
            revision: { type: integer, minimum: 1 }
            topK: { type: integer, minimum: 1 }
            rankingPolicyVersion: { type: string, minLength: 1 }
            fingerprint: { type: string, minLength: 1 }
            createdAt: { type: string, format: date-time }
            items:
              type: array
              items: { $ref: '#/components/schemas/LeaderboardEntry' }

    Sentiment:
      type: object
      additionalProperties: false
      required: [label, confidence, polarityScore]
      properties:
        label: { type: string, enum: [POSITIVE, NEUTRAL, NEGATIVE] }
        confidence: { $ref: '#/components/schemas/ConfidenceString' }
        polarityScore: { $ref: '#/components/schemas/PolarityScoreString' }
    NewsAnalysisStatus:
      type: string
      enum: [PENDING, ANALYZING, ANALYZED, FAILED_RETRYABLE, FAILED]
    NewsItem:
      type: object
      additionalProperties: false
      required: [newsId, title, source, url, publishedAt, analysisStatus, relatedAssetIds, sentiment]
      properties:
        newsId: { $ref: '#/components/schemas/OpaqueId' }
        title: { type: string, minLength: 1 }
        source: { type: string, minLength: 1 }
        url: { type: string, format: uri }
        publishedAt: { type: string, format: date-time }
        analysisStatus: { $ref: '#/components/schemas/NewsAnalysisStatus' }
        relatedAssetIds:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/OpaqueId' }
        sentiment:
          oneOf:
            - $ref: '#/components/schemas/Sentiment'
            - type: 'null'
          description: Null while sentiment is unavailable or pending.
    NewsItemPage:
      allOf:
        - $ref: '#/components/schemas/PaginationFields'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/NewsItem' }

    WebSocketTicket:
      type: object
      additionalProperties: false
      required: [ticket, expiresAt]
      properties:
        ticket:
          type: string
          minLength: 32
          description: Opaque, single-use credential; it must not be logged or reused.
        expiresAt: { type: string, format: date-time }

    SentimentAudit:
      type: object
      additionalProperties: false
      required: [sentimentResultId, newsId, language, contentHash, modelName, modelVersion, preprocessingVersion, contractVersion, label, confidence, polarityScore, analyzedAt]
      properties:
        sentimentResultId: { $ref: '#/components/schemas/OpaqueId' }
        newsId: { $ref: '#/components/schemas/OpaqueId' }
        language: { type: string, const: en }
        contentHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        modelName: { type: string, minLength: 1 }
        modelVersion: { type: string, minLength: 1 }
        preprocessingVersion: { type: string, minLength: 1 }
        contractVersion: { type: string, const: sentiment-v1 }
        label: { type: string, enum: [POSITIVE, NEUTRAL, NEGATIVE] }
        confidence: { $ref: '#/components/schemas/ConfidenceString' }
        polarityScore: { $ref: '#/components/schemas/PolarityScoreString' }
        analyzedAt: { type: string, format: date-time }

    FieldError:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
    ErrorDetails:
      type: object
      additionalProperties: true
      properties:
        fieldErrors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        resourceType: { type: string }
        resourceId: { $ref: '#/components/schemas/OpaqueId' }
        currentState: { type: string }
        allowedStates:
          type: array
          items: { type: string }
        retryable: { type: boolean }
        retryAfterSeconds: { type: [integer, 'null'], minimum: 1 }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, details, correlationId, timestamp]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        message: { type: string, minLength: 1 }
        details: { $ref: '#/components/schemas/ErrorDetails' }
        correlationId: { $ref: '#/components/schemas/OpaqueId' }
        timestamp: { type: string, format: date-time }
      example:
        code: STRATEGY_PARAMETERS_INVALID
        message: Strategy parameters are invalid.
        details:
          fieldErrors:
            - field: strategy.parameters.fastPeriod
              reason: must be less than slowPeriod
          retryable: false
        correlationId: 01JBACKTESTREQUEST0000000001
        timestamp: '2026-08-16T02:05:00Z'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalServiceToken:
      type: http
      scheme: bearer
      description: Rotated internal service token; never exposed to browser clients.
